name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: System deps (python-rtmidi)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev build-essential

      - name: Install pdm
        run: pip install pdm

      - name: Install project
        run: pdm install -G dev

      - name: Lint
        run: pdm run lint

      - name: Typecheck
        run: pdm run typecheck

      - name: Test
        run: pdm run test
